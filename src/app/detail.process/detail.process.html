<mat-card>
  <mat-card-title>{{ processo.processo }}</mat-card-title>
  <mat-card-subtitle>{{ processo.setor }} — {{ processo.cargo }}</mat-card-subtitle>
  <mat-card-content>
    <p><strong>Descrição:</strong> {{ processo.descricao }}</p>
    <p><strong>Passos:</strong></p>
    <ul>
      <li *ngFor="let passo of processo.passos">{{ passo }}</li>
    </ul>
    <p><strong>Sigiloso:</strong> {{ processo.sigiloso ? 'Sim' : 'Não' }}</p>
  </mat-card-content>
</mat-card>
