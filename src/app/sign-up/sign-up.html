<mat-card class="register-container">
<h2>Cadastro de Processo</h2>
<form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
  <mat-form-field appearance="fill"><mat-label>Nome</mat-label>
    <input matInput formControlName="nome" required />
  </mat-form-field>
 
<mat-form-field appearance="fill">
  <mat-label>Setor</mat-label>
  <input matInput formControlName="setor" required />
</mat-form-field>

<mat-form-field appearance="fill">
  <mat-label>Cargo</mat-label>
  <input matInput formControlName="cargo" required />
</mat-form-field>

<mat-form-field appearance="fill">
  <mat-label>Nome do Processo</mat-label>
  <input matInput formControlName="processo" required />
</mat-form-field>

<mat-form-field appearance="fill">
  <mat-label>Descrição do Processo</mat-label>
  <textarea matInput formControlName="descricao" rows="3"></textarea>
</mat-form-field>

<mat-form-field appearance="fill">
  <mat-label>Passo a Passo</mat-label>
  <textarea matInput formControlName="passos" rows="4"></textarea>
</mat-form-field>

<label class="sigilo-label">Processo é sigiloso?</label>
<mat-radio-group formControlName="sigiloso" class="sigilo-group">
  <mat-radio-button value="sim" class="button-sigilo">Sim</mat-radio-button>
  <mat-radio-button value="nao" class="button-sigilo">Não</mat-radio-button>
</mat-radio-group>

<button mat-raised-button color="primary" class="button-subimit" type="submit">Cadastrar</button>
<button mat-raised-button color="primary" class="button-reset" type="reset">Cancelar</button>
</form>
</mat-card>
