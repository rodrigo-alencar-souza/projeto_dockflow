<mat-toolbar color="primary" class="custom-toolbar">
  <button mat-icon-button (click)="sidenav.toggle()" aria-label="Fechar Sidebar" class="menu-icon">
    <mat-icon class="icon-size">menu</mat-icon>
  </button>
  <span class="toolbar-title">📕DockFlow</span>
  <div class="button">
        <button class="login-button" routerLink="/login" > Login </button>
  </div>
</mat-toolbar>

<mat-sidenav-container class="container">
  <mat-sidenav #sidenav mode="side" [(opened)]="sidebarAberta">
    <mat-nav-list class="nav-list">
      <mat-list-item >
        <span matLine  class="text-nav" routerLink="/general"> Geral </span>
      </mat-list-item>
      <mat-list-item>
        <span matLine  class="text-nav" routerLink="/engineering"> Engenharia </span>
      </mat-list-item>  
      <mat-list-item>
        <span matLine  class="text-nav" routerLink="/tax"> Fiscal </span>
      </mat-list-item>  
      <mat-list-item>
        <span matLine  class="text-nav" routerLink="/production"> Prudução </span>
      </mat-list-item>  
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <div>
      <h2>Bem Vindo ao Site</h2>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
