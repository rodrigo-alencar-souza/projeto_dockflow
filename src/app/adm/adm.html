<app-sidebar>
  <div class="admin-dashboard">
  <h2>ADMIN DASHBOARD</h2>

  <!-- User Approval Section -->
  <mat-card class="section-card">
    <h2>User Approval</h2>
    <table mat-table [dataSource]="userData" class="approval-table">

      <!-- User Column -->
      <ng-container matColumnDef="user">
        <th mat-header-cell *matHeaderCellDef>User</th>
        <td mat-cell *matCellDef="let element">{{ element.name }}</td>
      </ng-container>

      <!-- Sector Columns -->
      <ng-container matColumnDef="general">
        <th mat-header-cell *matHeaderCellDef>General</th>
        <td mat-cell *matCellDef="let element">
          <mat-checkbox [(ngModel)]="element.general" ></mat-checkbox>
        </td>
      </ng-container>

      <ng-container matColumnDef="engineering">
        <th mat-header-cell *matHeaderCellDef>Engineering</th>
        <td mat-cell *matCellDef="let element">
          <mat-checkbox [(ngModel)]="element.engineering" ></mat-checkbox>
        </td>
      </ng-container>

      <ng-container matColumnDef="production">
        <th mat-header-cell *matHeaderCellDef>Production</th>
        <td mat-cell *matCellDef="let element">
          <mat-checkbox [(ngModel)]="element.production" ></mat-checkbox>
        </td>
      </ng-container>

      <!-- Status Column -->
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let element">
          <button mat-icon-button color="primary" (click)="approveUser(element)">
            <mat-icon class = "aproved-button">check_circle</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="rejectUser(element)">
            <mat-icon class = "reproved-button">cancel</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="userDisplayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: userDisplayedColumns;"></tr>
    </table>
  </mat-card>

  <!-- Process Approval Section -->
  <mat-card class="section-card">
    <h2>Process Approval</h2>
    <table mat-table [dataSource]="processData" class="approval-table">

      <!-- Process Column -->
      <ng-container matColumnDef="process">
        <th mat-header-cell *matHeaderCellDef>Process</th>
        <td mat-cell *matCellDef="let element">{{ element.name }}</td>
      </ng-container>

      <!-- Status Column -->
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let element">
          <button mat-icon-button color="primary" (click)="approveProcess(element)">
            <mat-icon>check_circle</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="rejectProcess(element)">
            <mat-icon>cancel</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="processDisplayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: processDisplayedColumns;"></tr>
    </table>
  </mat-card>

  <!-- Approved Users Section -->
  <mat-card class="section-card" *ngIf="approvedUsers.length > 0">
    <h2>Usuários Aprovados</h2>
    <table mat-table [dataSource]="approvedUsers" class="approval-table">

      <!-- User Column -->
      <ng-container matColumnDef="user">
        <th mat-header-cell *matHeaderCellDef>Usuário</th>
        <td mat-cell *matCellDef="let element">{{ element.name }}</td>
      </ng-container>

      <!-- Sector Columns -->
      <ng-container matColumnDef="general">
        <th mat-header-cell *matHeaderCellDef>Geral</th>
        <td mat-cell *matCellDef="let element">
          <mat-checkbox [(ngModel)]="element.general" ></mat-checkbox>
        </td>
      </ng-container>

      <ng-container matColumnDef="engineering">
        <th mat-header-cell *matHeaderCellDef>Engenharia</th>
        <td mat-cell *matCellDef="let element">
          <mat-checkbox [(ngModel)]="element.engineering" ></mat-checkbox>
        </td>
      </ng-container>

      <ng-container matColumnDef="production">
        <th mat-header-cell *matHeaderCellDef>Produção</th>
        <td mat-cell *matCellDef="let element">
          <mat-checkbox [(ngModel)]="element.production" ></mat-checkbox>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="approvedUserColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: approvedUserColumns;"></tr>

      <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef>Ação</th>
        <td mat-cell *matCellDef="let element">
          <button mat-icon-button color="warn" (click)="confirmDelete(element)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>
    </table>
  </mat-card>

</div>
</app-sidebar>
